<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom Flower Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🌸 Bloom Flower Shop</h1>
    <p>Fresh flowers for every occasion</p>
    <div class="cart">🛒 Cart: <span id="cart-count">0</span></div>
  </header>

  <section class="hero">
    <h2>Beautiful Flowers, Beautiful Moments</h2>
    <p>Choose your favorite flowers from our collection.</p>
  </section>

  <main>
    <h2>Our Flower Collection</h2>

    <div class="products">
      <div class="card">
        <div class="flower">🌹</div>
        <h3>Red Roses</h3>
        <p>₹499</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="card">
        <div class="flower">🌷</div>
        <h3>Tulips</h3>
        <p>₹399</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="card">
        <div class="flower">🌻</div>
        <h3>Sunflowers</h3>
        <p>₹299</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="card">
        <div class="flower">💐</div>
        <h3>Flower Bouquet</h3>
        <p>₹699</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Bloom Flower Shop</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
